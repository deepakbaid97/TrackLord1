<!html>
<html lang="en" class="light">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.png" />
		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#004ac6" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta name="apple-mobile-web-app-title" content="TrackLord" />
		<meta name="application-name" content="TrackLord" />
		<meta name="description" content="Enterprise manufacturing batch, lot, step, and inventory tracking system." />
		<title>TrackLord ERP - Production Tracking</title>

		<!-- Tailwind CSS CDN with Forms & Container Queries Plugins -->
		<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

		<!-- Google Fonts & Material Symbols -->
		<link rel="preconnect" href="https://fonts.googleapis.com">
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
		<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
		<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />

		<!-- Tailwind Configuration matching Stitch Project tokens -->
		<script id="tailwind-config">
			tailwind.config = {
				darkMode: "class",
				theme: {
					extend: {
						"colors": {
							"tertiary-fixed-dim": "#ffb599",
							"on-secondary-container": "#007230",
							"on-secondary": "#ffffff",
							"primary-container": "#2563eb",
							"error": "#ba1a1a",
							"on-surface": "#0b1c30",
							"tertiary": "#973400",
							"surface-container-low": "#eff4ff",
							"inverse-primary": "#b4c5ff",
							"primary-fixed": "#dbe1ff",
							"on-primary": "#ffffff",
							"primary-fixed-dim": "#b4c5ff",
							"surface-variant": "#d3e4fe",
							"surface-dim": "#cbdbf5",
							"secondary-fixed": "#7ffc97",
							"outline-variant": "#c3c6d7",
							"on-surface-variant": "#434655",
							"secondary-container": "#7cf994",
							"surface-tint": "#0053db",
							"on-background": "#0b1c30",
							"on-error": "#ffffff",
							"background": "#f8f9ff",
							"on-primary-fixed": "#00174b",
							"on-tertiary-container": "#ffede7",
							"secondary": "#006e2d",
							"tertiary-fixed": "#ffdbce",
							"surface-bright": "#f8f9ff",
							"surface": "#f8f9ff",
							"inverse-on-surface": "#eaf1ff",
							"on-tertiary": "#ffffff",
							"error-container": "#ffdad6",
							"secondary-fixed-dim": "#62df7d",
							"outline": "#737686",
							"surface-container-high": "#dce9ff",
							"on-primary-fixed-variant": "#003ea8",
							"on-secondary-fixed-variant": "#005320",
							"inverse-surface": "#213145",
							"on-tertiary-fixed": "#370e00",
							"surface-container": "#e5eeff",
							"tertiary-container": "#c04400",
							"on-tertiary-fixed-variant": "#7f2b00",
							"surface-container-lowest": "#ffffff",
							"on-primary-container": "#eeefff",
							"surface-container-highest": "#d3e4fe",
							"on-secondary-fixed": "#002109",
							"on-error-container": "#93000a",
							"primary": "#004ac6"
						},
						"borderRadius": {
							"DEFAULT": "0.25rem",
							"lg": "0.5rem",
							"xl": "0.75rem",
							"full": "9999px"
						},
						"spacing": {
							"base": "8px",
							"gutter": "16px",
							"touch-target-min": "48px",
							"margin-desktop": "32px",
							"card-padding": "20px",
							"margin-mobile": "16px"
						},
						"fontFamily": {
							"label-caps": ["JetBrains Mono"],
							"body-lg": ["Inter"],
							"headline-md": ["Inter"],
							"headline-lg-mobile": ["Inter"],
							"stat-label": ["Inter"],
							"headline-lg": ["Inter"],
							"display-metrics": ["Inter"],
							"body-md": ["Inter"]
						},
						"fontSize": {
							"label-caps": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600" }],
							"body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }],
							"headline-md": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
							"headline-lg-mobile": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],
							"stat-label": ["14px", { "lineHeight": "20px", "fontWeight": "500" }],
							"headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
							"display-metrics": ["48px", { "lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
							"body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }]
						}
					}
				}
			}
		</script>

		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover" class="bg-background text-on-background antialiased min-h-screen pb-24 md:pb-0 pt-touch-target-min">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
